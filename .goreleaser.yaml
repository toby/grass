# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for grass, a Rust CLI.
# Docs: https://goreleaser.com/customization/builds/builders/rust/
version: 2

project_name: grass

before:
  hooks:
    # A default toolchain must be set for cargo/rustup to work.
    - rustup default stable

builds:
  - id: grass
    builder: rust
    binary: grass
    # Built with `cargo zigbuild` (the default command for the rust builder).
    # GoReleaser runs `rustup target add` for each target automatically.
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-gnu
    flags:
      - --release

archives:
  - id: grass
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: toby
    name: grass
  draft: false
  prerelease: auto
