[package]
name = "grass"
version = "0.1.0"
edition = "2021"
description = "Download and sync all of your GitHub gists to a local directory."
license = "MIT"
repository = "https://github.com/toby/grass"
readme = "README.md"
keywords = ["github", "gist", "sync", "cli", "backup"]
categories = ["command-line-utilities"]

[[bin]]
name = "grass"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
